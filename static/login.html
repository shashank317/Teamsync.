<!-- static/login.html -->
<!DOCTYPE html>
<html lang="en" class="bg-white dark:bg-black text-black dark:text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - TeamSync</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen px-4">

  <div class="bg-white dark:bg-gray-800 p-6 rounded shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold mb-4">Login</h1>
    <form onsubmit="login(event)">
      <input id="email" type="email" placeholder="Email"
        class="w-full mb-3 px-3 py-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" required />
      <input id="password" type="password" placeholder="Password"
        class="w-full mb-3 px-3 py-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" required />
      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">Login</button>
    </form>
    <p class="mt-4 text-sm text-gray-500 dark:text-gray-300">
      Don't have an account?
      <a href="/static/signup.html" class="text-blue-500 underline">Sign up</a>
    </p>
  </div>

  <script>
    async function login(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (res.ok && data.access_token) {
        localStorage.setItem("token", data.access_token);
        window.location.href = "/static/dashboard.html";  // or any page
      } else {
        alert(data.detail || "Login failed");
      }
    }

    // Auto-enable dark mode
    if (localStorage.getItem("darkMode") === "true") {
      document.documentElement.classList.add("dark");
    }
  </script>

</body>
</html>
